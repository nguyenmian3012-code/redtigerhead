name: Price Sync Preview

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Publication slot
        required: true
        type: choice
        options: [AM, PM]
        default: AM

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: astro-preview
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Sync Google Sheet to PostgreSQL and sanitized site data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: 8-Production Close
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PRICE_SYNC_SLOT: ${{ inputs.slot }}
        run: node scripts/sync-prices.mjs

      - name: Commit sanitized public price data
        run: |
          if git diff --quiet -- src/data/prices.json; then
            echo "No public price file change."
            exit 0
          fi
          git config user.name "redtigerhead-price-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "data: sync public starch price (${{ inputs.slot }})"
          git push origin HEAD:astro-preview
