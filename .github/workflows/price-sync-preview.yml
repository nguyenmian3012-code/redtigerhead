name: Price Sync Production

on:
  schedule:
    # 07:15 and 15:15 in Vietnam (UTC+7).
    - cron: '15 0 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Publication slot
        required: true
        type: choice
        options: [AM, PM]
        default: AM

permissions:
  contents: write

concurrency:
  group: price-sync-production
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Google Sheet to sanitized site data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: 8-Production Close
          PRICE_SYNC_SLOT: ${{ inputs.slot }}
        run: node scripts/sync-prices.mjs

      - name: Validate public price data
        run: npm test

      - name: Commit sanitized public price data
        run: |
          if git diff --quiet -- src/data/prices.json; then
            echo "No public price file change."
            exit 0
          fi
          git config user.name "redtigerhead-price-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "data: sync public starch price"
          git pull --rebase origin main
          git push origin HEAD:main
